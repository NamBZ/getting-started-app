version: 0.2

env:
  shell: bash

phases:
  pre_build:
    commands:
      - echo "=== Preparing build environment ==="
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REPOSITORY_URI="$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/ecs-todo-lab"
      - IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:0:12}"
      - |
        if [ -z "$IMAGE_TAG" ]; then
          IMAGE_TAG="manual-$(date +%s)"
        fi
      - echo "Image tag is $IMAGE_TAG"
      - |
        aws ecr get-login-password \
          --region "$AWS_DEFAULT_REGION" | \
        docker login \
          --username AWS \
          --password-stdin \
          "$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"

  build:
    commands:
      - echo "=== Building Docker image ==="
      - docker build --platform linux/amd64 -t "$REPOSITORY_URI:$IMAGE_TAG" .
      - docker tag "$REPOSITORY_URI:$IMAGE_TAG" "$REPOSITORY_URI:latest"

  post_build:
    commands:
      - echo "=== Pushing Docker image to ECR ==="
      - docker push "$REPOSITORY_URI:$IMAGE_TAG"
      - docker push "$REPOSITORY_URI:latest"
      - echo "=== Creating ECS image definition ==="
      - printf '[{"name":"todo-app","imageUri":"%s"}]' "$REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
